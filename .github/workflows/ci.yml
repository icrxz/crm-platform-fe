name: Next.js CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

# Compartilhado por todos os jobs (build da app precisa deles em qualquer
# job): evita repetir o mesmo bloco de placeholders em cada job.
env:
  CRM_CORE_ENDPOINT: ${{ secrets.CRM_CORE_ENDPOINT || 'http://localhost:8080' }}
  CRM_CORE_API_KEY: ${{ secrets.CRM_CORE_API_KEY || 'ci-placeholder' }}
  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-placeholder-secret' }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-placeholder-auth-secret' }}
  AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME || 'ci-placeholder-bucket' }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'ci-placeholder' }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'ci-placeholder' }}

jobs:
  build-lint-test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter (ESLint)
        run: npm run lint

      - name: Executar Testes Unitários (Jest)
        # O argumento --ci garante que o Jest corre de forma otimizada para ambientes de automação
        run: npm run test:ci

      - name: Validar Build da Aplicação
        run: npm run build

  visual-regression:
    name: Testes Visuais (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes visuais em 1280x720, 1366x768 e 1920x1080
        # Sobe a app via `npm run build && npm run start` (config no
        # playwright.config.ts) contra as fixtures em src/app/qa-fixtures,
        # sem precisar de login/backend real.
        run: npm run test:visual
        env:
          CI: "true"

      - name: Publicar relatório de falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
